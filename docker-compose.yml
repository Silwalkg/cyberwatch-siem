version: '3.8'

services:

  # FastAPI backend — SQLite, no external DB required
  backend:
    build: ./backend
    container_name: siem-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY env var is required}
      DEMO_MODE: ${DEMO_MODE:-false}
      # SQLite DB stored on the named volume so data survives container recreation.
      DATABASE_URL: sqlite:////app/data/cyberwatch.db
      # CORS_ORIGINS restricts which frontend origins may call the API.
      # When running via this compose file the frontend is served by nginx
      # on the same host, so restrict to localhost by default.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database across container restarts
      - siem_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Nginx — serves the static frontend and proxies /api/ and /ws/ to backend
  frontend:
    image: nginx:alpine
    container_name: siem-frontend
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  siem_data:

networks:
  default:
    name: siem-network
