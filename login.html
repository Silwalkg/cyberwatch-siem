<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberWatch SIEM — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Inter, sans-serif;
      background: #e8f0fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Circuit background */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Big shield watermark left */
    .bg-shield {
      position: fixed;
      left: -60px; top: 50%;
      transform: translateY(-50%);
      width: 380px; height: 380px;
      opacity: 0.12;
      pointer-events: none;
    }

    /* Circuit lines SVG right side */
    .bg-circuit {
      position: fixed;
      right: 0; top: 0;
      width: 340px; height: 100%;
      opacity: 0.08;
      pointer-events: none;
    }

    /* Card */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(30,64,175,0.12), 0 4px 16px rgba(0,0,0,0.06);
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .shield-logo {
      width: 80px; height: 80px;
      margin-bottom: 14px;
    }

    .brand-name {
      font-size: 22px; font-weight: 800;
      letter-spacing: 1px;
      color: #1e3a5f;
    }

    .brand-name span {
      color: #2563eb;
    }

    .divider-line {
      display: flex; align-items: center; gap: 10px;
      margin: 8px 0 4px;
      color: #94a3b8; font-size: 13px;
    }

    .divider-line::before,
    .divider-line::after {
      content: "";
      flex: 1; height: 1px;
      background: #e2e8f0;
    }

    .brand-sub {
      font-size: 13px; color: #64748b;
      margin-top: 2px;
    }

    /* Form */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      display: flex; align-items: center;
    }

    .input-icon {
      position: absolute; left: 13px;
      color: #94a3b8; font-size: 16px;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 11px 42px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: #fff;
    }

    .input-wrap input::placeholder { color: #b0bac4; }

    .toggle-pw {
      position: absolute; right: 13px;
      background: none; border: none;
      cursor: pointer; color: #94a3b8;
      font-size: 16px; padding: 0;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: #2563eb; }

    /* Remember / Forgot */
    .row-between {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .remember {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #4b5563;
      cursor: pointer; user-select: none;
    }

    .remember input[type=checkbox] {
      width: 15px; height: 15px;
      accent-color: #2563eb; cursor: pointer;
      border-radius: 3px;
    }

    .forgot {
      font-size: 13px; color: #2563eb;
      text-decoration: none; font-weight: 500;
      transition: opacity 0.2s;
    }
    .forgot:hover { opacity: 0.75; }

    /* Login button */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px; font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) {
      background: #1d4ed8;
      box-shadow: 0 4px 20px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }

    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* OR divider */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0 16px;
      font-size: 12px; color: #94a3b8;
    }
    .or-divider::before, .or-divider::after {
      content: ""; flex: 1; height: 1px; background: #e2e8f0;
    }

    /* Secure access bar */
    .secure-bar {
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      font-size: 12px; color: #64748b;
    }

    .secure-bar svg { color: #2563eb; }

    /* Error */
    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      color: #dc2626;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <!-- Background shield -->
  <svg class="bg-shield" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 10 L180 45 L180 110 C180 155 100 210 100 210 C100 210 20 155 20 110 L20 45 Z" fill="#2563eb"/>
    <circle cx="100" cy="105" r="35" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="100" cy="105" r="10" fill="white"/>
    <line x1="100" y1="70" x2="100" y2="80" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="130" x2="100" y2="140" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="105" x2="75" y2="105" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="125" y1="105" x2="135" y2="105" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <svg class="shield-logo" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="100" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e40af"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <path d="M50 4 L90 22 L90 55 C90 78 50 106 50 106 C50 106 10 78 10 55 L10 22 Z" fill="url(#sg)"/>
        <!-- Eye -->
        <ellipse cx="50" cy="54" rx="18" ry="10" fill="none" stroke="white" stroke-width="2.5"/>
        <circle cx="50" cy="54" r="6" fill="white"/>
        <circle cx="50" cy="54" r="3" fill="#1e40af"/>
        <!-- Circuit lines -->
        <line x1="10" y1="38" x2="25" y2="38" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="75" y1="38" x2="90" y2="38" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="25" y1="38" x2="25" y2="30" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="75" y1="38" x2="75" y2="30" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="25" cy="30" r="2" fill="#93c5fd"/>
        <circle cx="75" cy="30" r="2" fill="#93c5fd"/>
      </svg>

      <div class="brand-name">CYBERWATCH<span>SIEM</span></div>
      <div class="divider-line">Platform v2.0</div>
      <div class="brand-sub">Security Monitoring &amp; Threat Detection</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="field">
        <label for="username">Email / Username</label>
        <div class="input-wrap">
          <span class="input-icon">&#128100;</span>
          <input type="text" id="username" name="username"
                 placeholder="Enter your email or username"
                 autocomplete="username" spellcheck="false" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">&#128274;</span>
          <input type="password" id="password" name="password"
                 placeholder="Enter your password"
                 autocomplete="current-password" required />
          <button type="button" class="toggle-pw" onclick="togglePassword()" id="toggle-btn">&#128065;</button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" />
          Remember me
        </label>
        <a href="#" class="forgot" onclick="return false;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login" id="login-btn">LOGIN</button>

      <div class="error-msg" id="error-msg">Invalid credentials. Please try again.</div>

    </form>

    <div class="or-divider">OR</div>

    <div class="secure-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Secure Access &nbsp;|&nbsp; MFA Enabled
    </div>

  </div>

<script src="js/data.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "index.html";

  function togglePassword() {
    const input = document.getElementById("password");
    const btn   = document.getElementById("toggle-btn");
    if (input.type === "password") {
      input.type = "text";
      btn.innerHTML = "&#128064;";
    } else {
      input.type = "password";
      btn.innerHTML = "&#128065;";
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn      = document.getElementById("login-btn");
    const errEl    = document.getElementById("error-msg");

    if (!username || !password) {
      errEl.textContent = "Please enter both username and password.";
      errEl.classList.add("show");
      return;
    }

    btn.disabled    = true;
    btn.textContent = "Signing in...";
    errEl.classList.remove("show");

    // Try real backend first, fall back to demo mode
    fetch('http://localhost:8000/api/auth/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
    })
    .then(res => res.json())
    .then(data => {
      if (data.access_token) {
        localStorage.setItem('cw_token',    data.access_token);
        localStorage.setItem('cw_username', data.username || username);
        localStorage.setItem('cw_role',     data.role || (username.toLowerCase() === 'admin' ? 'Administrator' : 'SOC Analyst'));
        btn.textContent = 'Success! Redirecting...';
        setTimeout(() => window.location.href = 'index.html', 400);
      } else {
        errEl.textContent = 'Invalid credentials. Please try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In ?';
      }
    })
    .catch(() => {
      // Backend not running - fall back to demo mode
      const ok = Auth.login(username, password);
      if (ok) {
        btn.textContent = 'Success! Redirecting...';
        setTimeout(() => window.location.href = 'index.html', 400);
      } else {
        errEl.textContent = 'Invalid credentials. Please try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In ?';
      }
    });
  }

  document.getElementById("username").addEventListener("keydown", function(e) {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("password").focus(); }
  });
</script>
</body>
</html>
